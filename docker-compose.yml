services:
  # Core Services
  redis:
    image: redis:7-alpine
    container_name: throttl-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - throttl-network

  postgres:
    image: postgres:15-alpine
    container_name: throttl-postgres
    environment:
      POSTGRES_USER: throttl
      POSTGRES_PASSWORD: throttl
      POSTGRES_DB: throttl
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttl -d throttl"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - throttl-network

  # Throttl API
  throttl:
    build: .
    container_name: throttl-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
      - DATABASE_URL=postgres://throttl:throttl@postgres:5432/throttl?sslmode=disable
      - PORT=8080
      - THROTTL_ENV=production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - throttl-network

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: throttl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: always
    depends_on:
      - throttl
    networks:
      - throttl-network

  grafana:
    image: grafana/grafana:latest
    container_name: throttl-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3002
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: always
    depends_on:
      - prometheus
    networks:
      - throttl-network

  # Frontend Dashboard
  frontend:
    build: ./frontend
    container_name: throttl-frontend
    ports:
      - "3001:3001"
    environment:
      - THROTTL_API_URL=http://throttl:8080
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - NEXT_PUBLIC_THROTTL_API_URL=http://localhost:8080
      - NEXT_PUBLIC_PROMETHEUS_URL=http://localhost:9090
      - NEXT_PUBLIC_GRAFANA_URL=http://localhost:3002
    depends_on:
      - throttl
      - grafana
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - throttl-network

  # Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: throttl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - throttl
      - frontend
      - grafana
    restart: always
    networks:
      - throttl-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  throttl-network:
    driver: bridge
