apiVersion: apps/v1
kind: Deployment
metadata:
  name: throttl-api
  namespace: throttl
  labels:
    app: throttl-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: throttl-api
  template:
    metadata:
      labels:
        app: throttl-api
    spec:
      containers:
      - name: throttl-api
        image: throttl:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: throttl-config
        - secretRef:
            name: throttl-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: throttl-api-service
  namespace: throttl
spec:
  selector:
    app: throttl-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: throttl-api-ingress
  namespace: throttl
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  rules:
  - host: api.throttl.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: throttl-api-service
            port:
              number: 8080