apiVersion: apps/v1
kind: Deployment
metadata:
  name: throttl-frontend
  namespace: throttl
  labels:
    app: throttl-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: throttl-frontend
  template:
    metadata:
      labels:
        app: throttl-frontend
    spec:
      containers:
      - name: throttl-frontend
        image: throttl-frontend:latest
        ports:
        - containerPort: 3001
        env:
        - name: THROTTL_API_URL
          value: "http://throttl-api-service:8080"
        - name: PROMETHEUS_URL
          value: "http://prometheus:9090"
        - name: GRAFANA_URL
          value: "http://grafana:3000"
        - name: NEXT_PUBLIC_THROTTL_API_URL
          value: "http://localhost:8080"
        - name: NEXT_PUBLIC_PROMETHEUS_URL
          value: "http://localhost:9090"
        - name: NEXT_PUBLIC_GRAFANA_URL
          value: "http://localhost:3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"

---
apiVersion: v1
kind: Service
metadata:
  name: throttl-frontend-service
  namespace: throttl
spec:
  selector:
    app: throttl-frontend
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: throttl-frontend-ingress
  namespace: throttl
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  rules:
  - host: throttl.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: throttl-frontend-service
            port:
              number: 3001